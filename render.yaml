services:
  - type: web
    name: jarvis-tradeanalyzer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_FALLBACK_MODELS
        value: openrouter/free
      - key: OPENROUTER_WEB_SEARCH
        value: "true"
      - key: HUGGINGFACE_MODEL
        value: openai/gpt-oss-120b:fastest
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CMC_API_KEY
        sync: false
      - key: COINALYZE_API_KEY
        sync: false
      - key: OPENMARKET_API_KEY
        sync: false
