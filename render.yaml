services:
  - type: web
    name: jarvis-tradeanalyzer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SESSION_TTL_MINUTES
        value: 30
      - key: CMC_API_KEY
        sync: false
      - key: COINALYZE_API_KEY
        sync: false
      - key: OPENMARKET_API_KEY
        sync: false
