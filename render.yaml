services:
  - type: web
    name: jarvis-tradeanalyzer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_FALLBACK_MODELS
        value: openrouter/free
      - key: OPENROUTER_WEB_SEARCH
        value: "true"
      - key: HUGGINGFACE_MODEL
        value: openai/gpt-oss-120b:fastest
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CMC_API_KEY
        sync: false
      - key: COINALYZE_API_KEY
        sync: false
      - key: OPENMARKET_API_KEY
        sync: false
      - key: TRADING_MODE
        value: PAPER
      - key: ETORO_API_KEY
        sync: false
      - key: ETORO_USER_KEY
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EXECUTION_SIGNING_SECRET
        generateValue: true
      - key: EXCHANGE_WRITES_ENABLED
        value: "false"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: EXECUTION_ALLOWED_SYMBOLS
        value: BTC,ETH
      - key: EXECUTION_MAX_ORDER_USD
        value: "100"
      - key: EXECUTION_MAX_RISK_USD
        value: "5"
      - key: EXECUTION_MAX_OPEN_POSITIONS
        value: "1"
      - key: EXECUTION_MAX_DAILY_LOSS_USD
        value: "25"
      - key: EXECUTION_MAX_SPREAD_PCT
        value: "0.5"
      - key: EXECUTION_MAX_ENTRY_DEVIATION_PCT
        value: "0.75"
